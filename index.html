<style>

  h1 { font-family: 'DM Serif Display', serif; font-size: clamp(2.8rem,6vw,4.5rem); letter-spacing: -0.03em; color: var(--black); line-height: 1; display: inline-block; }

  .main-categories { display:flex; flex-direction:column; gap:10px; width:100%; max-width:340px; margin-bottom:40px; }
  .cat-btn { font-family:'DM Sans',sans-serif; font-size:1rem; font-weight:500; letter-spacing:.04em; padding:14px 28px; background:var(--white); color:var(--black); border:var(--border); border-radius:4px; cursor:pointer; transition:background .15s,color .15s,transform .1s; text-align:left; display:flex; align-items:center; justify-content:space-between; }
  .cat-btn:hover { background:var(--gray-100); transform:translateX(4px); }
  .cat-btn .arrow { font-size:.8rem; opacity:.5; }
  .subcategory-bar { display:none; flex-wrap:wrap; gap:8px; max-width:900px; width:100%; justify-content:center; margin-bottom:32px; }
  .subcategory-bar.visible { display:flex; }
  .sub-btn { font-family:'DM Mono',monospace; font-size:.72rem; letter-spacing:.06em; padding:7px 14px; background:var(--white); color:var(--gray-700); border:1.5px solid var(--gray-300); border-radius:30px; cursor:pointer; transition:all .15s; text-transform:uppercase; }
  .sub-btn:hover { border-color:var(--black); color:var(--black); }
  .sub-btn.active { background:var(--black); color:var(--white); border-color:var(--black); }

  .back-btn { display:none; align-items:center; gap:6px; font-family:'DM Mono',monospace; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--gray-500); background:none; border:none; cursor:pointer; margin-bottom:28px; transition:color .15s; }

  .search-input { width:100%; font-family:'DM Sans',sans-serif; font-size:.95rem; padding:13px 44px 13px 18px; border:var(--border); border-radius:6px; outline:none; background:var(--white); color:var(--black); transition:border-color .15s,box-shadow .15s; }
  .search-input:focus { border-color:var(--black); box-shadow:0 0 0 3px rgba(10,10,10,.07); }
  .search-input::placeholder { color:var(--gray-300); }
  .search-icon { position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--gray-300); pointer-events:none; font-size:1rem; }
  .search-clear { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--gray-500); font-size:1rem; padding:2px 4px; display:none; }
  .search-clear.visible { display:block; }

  .search-group { margin-bottom:28px; }

<script>
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
let drawing = false, penColor = '#0a0a0a', penSize = 4, lastX = 0, lastY = 0;

function resizeCanvas() {
  const w = canvas.parentElement.clientWidth;
  canvas.width = w; canvas.height = 260;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
}
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const sx = canvas.width/r.width, sy = canvas.height/r.height;
  if (e.touches) return [(e.touches[0].clientX-r.left)*sx,(e.touches[0].clientY-r.top)*sy];
  return [(e.clientX-r.left)*sx,(e.clientY-r.top)*sy];
}
function startDraw(e) {
  e.preventDefault(); drawing = true;
  [lastX,lastY] = getPos(e);
  ctx.beginPath(); ctx.arc(lastX,lastY,penSize/2,0,Math.PI*2);
  ctx.fillStyle = penColor; ctx.fill();
}
function draw(e) {
  if (!drawing) return; e.preventDefault();
  const [x,y] = getPos(e);
  ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(x,y);
  ctx.strokeStyle = penColor; ctx.lineWidth = penSize; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
  [lastX,lastY] = [x,y];
}
function endDraw() { drawing = false; }
canvas.addEventListener('mousedown',startDraw); canvas.addEventListener('mousemove',draw);
canvas.addEventListener('mouseup',endDraw); canvas.addEventListener('mouseleave',endDraw);
canvas.addEventListener('touchstart',startDraw,{passive:false}); canvas.addEventListener('touchmove',draw,{passive:false});
canvas.addEventListener('touchend',endDraw);
function clearCanvas() { ctx.clearRect(0,0,canvas.width,canvas.height); }
function setColor(el) { penColor=el.dataset.color; document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active')); el.classList.add('active'); }
function setSize(el) { penSize=parseInt(el.dataset.size); document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active')); el.classList.add('active'); }
function openDrawBoard(k,e) {
  document.getElementById('modalKr').textContent=k;
  document.getElementById('modalEn').textContent=e;
  document.getElementById('canvasRef').textContent=k;
  document.getElementById('drawOverlay').classList.add('open');
  resizeCanvas(); clearCanvas();
}
function closeDrawBoard() { document.getElementById('drawOverlay').classList.remove('open'); }
document.getElementById('drawOverlay').addEventListener('click',function(e){ if(e.target===this) closeDrawBoard(); });

let currentCategory = null;
let currentSub = null;

function goBack() {
  document.getElementById('mainCategories').style.display = 'flex';
  document.getElementById('wordGrid').classList.remove('visible');
  document.getElementById('subcategoryBar').classList.remove('visible');
  document.getElementById('sectionTitle').classList.remove('visible');
  document.getElementById('backBtn').classList.remove('visible');
  currentCategory = null; currentSub = null;
}

function showCategory(cat) {
  currentCategory = cat;
  document.getElementById('mainCategories').style.display = 'none';
  document.getElementById('backBtn').classList.add('visible');
  if (cat === 'nouns') {
    document.getElementById('subcategoryBar').classList.add('visible');
    document.getElementById('wordGrid').classList.remove('visible');
    document.getElementById('sectionTitle').textContent = 'Nouns — choose a category';
    document.getElementById('sectionTitle').classList.add('visible');
  } else {
    document.getElementById('subcategoryBar').classList.remove('visible');
    renderWords(DATA[cat], capitalize(cat));
  }
}

function showSub(sub) {
  currentSub = sub;
  document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderWords(DATA.nouns[sub], 'Nouns · ' + capitalize(sub));
}

function renderWords(words, title) {
  const grid = document.getElementById('wordGrid');
  const titleEl = document.getElementById('sectionTitle');
  titleEl.textContent = title;
  titleEl.classList.add('visible');
  grid.innerHTML = '';
  words.forEach((w) => {
    const card = document.createElement('div');
    card.className = 'word-card';
    card.innerHTML = `
      <div class="word-korean">${w.k}</div>
      <div class="word-english">${w.e}</div>
      <div style="margin-top:6px;font-family:'DM Mono',monospace;font-size:.62rem;color:#bbb;letter-spacing:.05em">✏ tap to practice</div>`;
    card.addEventListener('click', () => openDrawBoard(w.k, w.e));
    grid.appendChild(card);
  });
  grid.classList.add('visible');
}

function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
// ── SEARCH ──────────────────────────────────────────────────────────────────

const CATEGORY_LABELS = {
  verbs: 'Verbs',
  adverbs: 'Adverbs',
  adjectives: 'Adjectives',
  'nouns.travel': 'Nouns › Travel',
  'nouns.home': 'Nouns › Home',
  'nouns.nature': 'Nouns › Nature',
  'nouns.clothing': 'Nouns › Clothing',
  'nouns.education': 'Nouns › Education',
  'nouns.transportation': 'Nouns › Transportation',
  'nouns.institution': 'Nouns › Institution',
  'nouns.body': 'Nouns › Body',
  'nouns.animals': 'Nouns › Animals',
  'nouns.places': 'Nouns › Places',
  'nouns.media': 'Nouns › Media',
};

function buildIndex() {
  const index = [];
  ['verbs','adverbs','adjectives'].forEach(cat => {
    DATA[cat].forEach(w => index.push({ k: w.k, e: w.e, cat }));
  });
  Object.keys(DATA.nouns).forEach(sub => {
    DATA.nouns[sub].forEach(w => index.push({ k: w.k, e: w.e, cat: 'nouns.' + sub }));
  });
  return index;
}
const INDEX = buildIndex();

function handleSearch(q) {
  q = q.trim();
  const clearBtn = document.getElementById('searchClear');
  const icon = document.getElementById('searchIcon');
  const resultsEl = document.getElementById('searchResults');
  const mainCats = document.getElementById('mainCategories');
  const backBtn = document.getElementById('backBtn');

  if (!q) {
    clearBtn.classList.remove('visible');
    icon.style.display = 'inline';
    resultsEl.classList.remove('visible');
    resultsEl.innerHTML = '';
    if (!currentCategory) {
      mainCats.style.display = 'flex';
      backBtn.classList.remove('visible');
      document.getElementById('subcategoryBar').classList.remove('visible');
      document.getElementById('wordGrid').classList.remove('visible');
      document.getElementById('sectionTitle').classList.remove('visible');
    }
    return;
  }

  clearBtn.classList.add('visible');
  icon.style.display = 'none';
  mainCats.style.display = 'none';
  backBtn.classList.remove('visible');
  document.getElementById('subcategoryBar').classList.remove('visible');
  document.getElementById('wordGrid').classList.remove('visible');
  document.getElementById('sectionTitle').classList.remove('visible');

  const ql = q.toLowerCase();
  const matches = INDEX.filter(w => w.k.includes(q) || w.e.toLowerCase().includes(ql));

  resultsEl.innerHTML = '';

  if (matches.length === 0) {
    resultsEl.innerHTML = '<div class="no-results">No results for \"' + escHtml(q) + '\"</div>';
    resultsEl.classList.add('visible');
    return;
  }

  const groups = {};
  matches.forEach(w => {
    if (!groups[w.cat]) groups[w.cat] = [];
    groups[w.cat].push(w);
  });

  const totalCats = Object.keys(groups).length;
  const titleEl = document.createElement('div');
  titleEl.className = 'search-results-title';
  titleEl.innerHTML = 'Results for "<em>' + escHtml(q) + '</em>"<span>' + matches.length + ' word' + (matches.length!==1?'s':'') + ' across ' + totalCats + ' categor' + (totalCats!==1?'ies':'y') + '</span>';
  resultsEl.appendChild(titleEl);

  Object.keys(groups).forEach(cat => {
    const grp = document.createElement('div');
    grp.className = 'search-group';

    const lbl = document.createElement('div');
    lbl.className = 'search-group-label';
    lbl.innerHTML = '<strong>' + (CATEGORY_LABELS[cat] || cat) + '</strong> — ' + groups[cat].length + ' match' + (groups[cat].length!==1?'es':'');
    grp.appendChild(lbl);

    const grid = document.createElement('div');
    grid.className = 'search-grid';
    groups[cat].forEach(w => {
      const card = document.createElement('div');
      card.className = 'word-card';
      card.innerHTML =
        '<div class="word-korean">' + highlight(w.k, q) + '</div>' +
        '<div class="word-english">' + highlight(w.e, ql) + '</div>' +
        '<div style="margin-top:6px;font-family:\'DM Mono\',monospace;font-size:.62rem;color:#bbb;letter-spacing:.05em">✏ tap to practice</div>';
      card.addEventListener('click', () => openDrawBoard(w.k, w.e));
      grid.appendChild(card);
    });
    grp.appendChild(grid);
    resultsEl.appendChild(grp);
  });

  resultsEl.classList.add('visible');
}

function highlight(text, query) {
  if (!query) return escHtml(text);
  const re = new RegExp('(' + escRe(query) + ')', 'gi');
  return escHtml(text).replace(re, '<mark style="background:#f5e642;border-radius:2px;padding:0 1px">$1</mark>');
}
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function clearSearch() {
  const inp = document.getElementById('searchInput');
  inp.value = '';
  handleSearch('');
  inp.focus();
}
