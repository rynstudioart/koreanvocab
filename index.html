<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Korean Practice Words</title>
<style>
:root{
  --bg:#f6f8fa; --card:#ffffff; --muted:#6b7280; --accent:#2563eb;
  --success:#10b981;
}
html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;}
body{background:var(--bg);color:#111;padding:20px;box-sizing:border-box;}
.container{max-width:980px;margin:0 auto;}
h1{font-size:32px;margin:0 0 16px;}
.top-row{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
button{background:var(--card);border:1px solid #e6e9ee;padding:8px 12px;border-radius:8px;cursor:pointer;}
button.primary{background:var(--accent);color:white;border:none;}
.controls{display:flex;gap:8px;align-items:center;}
.second-row{display:flex;gap:8px;align-items:center;margin:12px 0 20px;flex-wrap:wrap;}
.category-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.category-btn{border-radius:16px;padding:8px 12px;background:#fff;border:1px solid #e6e9ee;cursor:pointer;}
.grid{display:flex;flex-wrap:wrap;gap:10px;}
.card{background:var(--card);min-width:140px;padding:12px;border-radius:12px;border:1px solid #e6e9ee;box-shadow:0 1px 0 rgba(0,0,0,0.02);cursor:pointer;}
.korean{font-weight:700;color:#0f172a;margin-bottom:6px;}
.english{color:var(--muted);font-size:14px;}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px;}
input[type="text"], select{padding:8px;border-radius:8px;border:1px solid #e6e9ee;background:#fff;}
.flex-row{display:flex;gap:8px;align-items:center;}
.modal-backdrop{position:fixed;inset:0;background:rgba(2,6,23,0.45);display:none;align-items:center;justify-content:center;z-index:60;}
.modal{background:var(--card);padding:18px;border-radius:12px;max-width:720px;width:100%;box-shadow:0 8px 30px rgba(2,6,23,0.2);}
.modal h2{margin:0 0 12px;}
.close{margin-left:auto;background:transparent;border:none;font-size:18px;cursor:pointer;}
.vocab-list{max-height:320px;overflow:auto;padding:8px;border-radius:8px;border:1px solid #e9eef6;background:#fbfdff;}
.search{width:100%;padding:8px;border-radius:8px;border:1px solid #e6e9ee;margin-bottom:8px;}
.small{font-size:13px;color:var(--muted);}
.mark{display:inline-block;padding:4px 8px;border-radius:8px;background:#f1f5f9;border:1px solid #e6eef8;color:#0f172a;font-weight:600;}
canvas{
  border:1px solid #e6e9ee;
  border-radius:8px;
  background:white;
  touch-action: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  display:block;
  width:100%;
  height:auto;
  pointer-events:auto;
}
.row-space{display:flex;justify-content:space-between;align-items:center;gap:12px;}
@media (max-width:680px){
  .card{min-width:120px;}
  .modal{
    max-width: 100vw;
    width: 100vw;
    border-radius: 0;
    padding:16px;
  }
  button,input,select{width:100%;box-sizing:border-box;text-align:center;}
  .word-btn{flex:1 1 45%;}
  .checkbox-container{display:flex;align-items:center;gap:6px;margin-top:6px;}
  .checkbox-container span{font-size:13px;}
  #toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--success);
  color: white;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
  z-index: 9999;
}
#toast.show {
  opacity: 1;
}

}
</style>
</head>
<body>
<main class="container" aria-live="polite">
<h1>Korean Practice Words</h1>

<div class="top-row">
  <div class="controls">
    <button id="saveBtn" class="primary">Save Progress</button>
    <button id="clearBtn">Clear All (unmark completed)</button>
    <button id="vocabBtn">Vocabulary</button>
  </div>
</div>

<div class="second-row">
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <div>
      <label class="small">New category name</label>
      <input id="newCategoryInput" type="text" placeholder="e.g. Phrases" />
    </div>
    <div style="align-self:flex-end;">
      <button id="addCategoryBtn">Add Category</button>
    </div>
  </div>

  <div style="display:flex;gap:8px;align-items:center;">
    <div>
      <label class="small">Category</label>
      <select id="addWordCategory"></select>
    </div>
    <div>
      <label class="small">Korean word (한글)</label>
      <input id="addWordKorean" type="text" placeholder="안녕하세요" />
    </div>
    <div>
      <label class="small">English translation</label>
      <input id="addWordEnglish" type="text" placeholder="hello" />
    </div>
    <div style="align-self:flex-end;">
      <button id="addWordBtn">Add Word</button>
    </div>
  </div>
</div>

<div class="category-list" id="categoryButtons"></div>

<section>
  <h3 id="categoryTitle">NOUNS</h3>
  <div id="wordsGrid" class="grid" aria-live="polite"></div>
</section>
</main>

<div id="wordModalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true">
  <div class="modal" role="document">
    <div class="row-space">
      <h2 id="modalWordTitle">Word</h2>
      <button class="close" id="closeWordModal">&times;</button>
    </div>
    <p class="small" id="modalWordEnglish">translation</p>
    <div style="margin:10px 0;">
      <label class="small">Practice writing</label>
      <canvas id="drawCanvas" width="600" height="220"></canvas>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button id="clearCanvasBtn">Clear Drawing</button>
        <button id="saveDrawingBtn">Save Drawing (to local state)</button>
        <button id="deleteWordBtn" style="background:#ef4444;color:white;border:none;">Delete Word</button>
        <label style="display:flex;align-items:center;gap:6px;margin-left:auto;">
          <input type="checkbox" id="markCompleteChk" />
          <span class="small"></span>
        </label>
      </div>
    </div>
    <div style="margin-top:12px;display:flex;justify-content:flex-end;gap:8px;">
      <button id="closeWordModal2">Close</button>
    </div>
  </div>
</div>

<div id="vocabBackdrop" class="modal-backdrop" role="dialog" aria-modal="true">
  <div class="modal" role="document">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
      <h2 style="margin:0;">Vocabulary (Completed)</h2>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center;width:70%;">
        <select id="vocabFilter" style="min-width:110px;">
          <option value="all">All</option>
        </select>
        <input id="vocabSearch" class="search" placeholder="Search by English or Korean" />
        <button id="closeVocab" class="close" title="Close">&times;</button>
      </div>
    </div>
    <div class="vocab-list" id="vocabList" aria-live="polite"></div>
  </div>
</div>

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return JSON.parse(JSON.stringify(defaultState));
    return JSON.parse(raw);
  } catch(e){return JSON.parse(JSON.stringify(defaultState));}
}
function saveState(){try{localStorage.setItem(STORAGE_KEY, JSON.stringify(state));}catch(e){}}

const ctx = drawCanvas.getContext('2d');
let drawing = false;
let last = {x:0,y:0};

function resizeCanvas(){
  const ratio = window.devicePixelRatio || 1;
  const cssWidth = drawCanvas.clientWidth;
  const cssHeight = 220;
  drawCanvas.width = cssWidth * ratio;
  drawCanvas.height = cssHeight * ratio;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(ratio,ratio);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#111';
}

function startDraw(e){
  drawing=true;
  const pt = e.touches ? e.touches[0] : e;
  const r = drawCanvas.getBoundingClientRect();
  last.x = pt.clientX - r.left;
  last.y = pt.clientY - r.top;
  if(e.cancelable)e.preventDefault();
  ctx.save();
  ctx.beginPath();
  ctx.fillStyle=ctx.strokeStyle||'#111';
  ctx.arc(last.x,last.y,(ctx.lineWidth||4)/2,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function moveDraw(e){
  if(!drawing)return;
  const pt = e.touches ? e.touches[0] : e;
  const r = drawCanvas.getBoundingClientRect();
  const x = pt.clientX - r.left;
  const y = pt.clientY - r.top;
  ctx.beginPath();
  ctx.moveTo(last.x,last.y);
  ctx.lineTo(x,y);
  ctx.stroke();
  last.x=x;last.y=y;
  if(e.cancelable)e.preventDefault();
}

function endDraw(e){drawing=false;if(e && e.cancelable)e.preventDefault();}

function clearCanvas(){
  ctx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,drawCanvas.width,drawCanvas.height);
  ctx.fillStyle='#111';
}

function openWordModal(id){
  currentWordId=id;
  const w=state.words.find(x=>x.id===id);
  if(!w)return;
  modalWordTitle.textContent=w.korean;
  modalWordEnglish.textContent=w.english;
  markCompleteChk.checked=!!w.completed;
  wordModalBackdrop.style.display='flex';
  resizeCanvas();
  clearCanvas();
  if(w.drawing){
    const img=new Image();
    img.onload=()=>{ctx.drawImage(img,0,0,drawCanvas.width/(window.devicePixelRatio||1),drawCanvas.height/(window.devicePixelRatio||1));};
    img.src=w.drawing;
  }
}

function closeWord(){wordModalBackdrop.style.display='none';currentWordId=null;}

function saveCanvasToState(){
  if(!currentWordId)return;
  const url=drawCanvas.toDataURL('image/png');
  const w=state.words.find(x=>x.id===currentWordId);
  if(w){w.drawing=url;saveState();flashMessage('Drawing saved');}
}

// Delete Word
deleteWordBtn.addEventListener('click', () => {
  if (!currentWordId) return;
  if (confirm('Are you sure you want to delete this word?')) {
    state.words = state.words.filter(w => w.id !== currentWordId);
    saveState();
    closeWord();
    renderWords();
    flashMessage('Word deleted');
  }
});

function renderCategories(){
  categoryButtons.innerHTML='';addWordCategory.innerHTML='';vocabFilter.innerHTML='<option value="all">All</option>';
  state.categories.forEach(cat=>{
    const btn=document.createElement('button');
    btn.className='category-btn';btn.textContent=cat;
    btn.addEventListener('click',()=>{activeCategory=cat;renderWords();});
    categoryButtons.appendChild(btn);
    const opt=document.createElement('option');opt.value=cat;opt.textContent=cat;
    addWordCategory.appendChild(opt);
    const vf=document.createElement('option');vf.value=cat;vf.textContent=cat;
    vocabFilter.appendChild(vf);
  });
}

function renderWords(){
  categoryTitle.textContent=activeCategory.toUpperCase();
  wordsGrid.innerHTML='';
  const list=state.words.filter(w=>w.category===activeCategory);
  if(list.length===0){wordsGrid.innerHTML='<div class="small">No words in this category yet.</div>';return;}
  list.forEach(w=>{
    const card=document.createElement('div');card.className='card';card.setAttribute('data-id',w.id);
    const k=document.createElement('div');k.className='korean';k.textContent=w.korean;
    const e=document.createElement('div');e.className='english';e.textContent=w.english;
    const status=document.createElement('div');status.style.marginTop='8px';
    if(w.completed){const mark=document.createElement('span');mark.className='mark';mark.textContent='Completed';status.appendChild(mark);}
    card.appendChild(k);card.appendChild(e);card.appendChild(status);
    card.addEventListener('click',()=>openWordModal(w.id));
    wordsGrid.appendChild(card);
  });
}

function flashMessage(msg, type='success'){
  const toast = document.getElementById('toast');
  toast.style.background = type==='error' ? '#ef4444' : 'var(--success)';
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}



renderCategories();renderWords();

addCategoryBtn.addEventListener('click',()=>{
  const name=(newCategoryInput.value||'').trim();
  if(!name){alert('Enter a category name');return;}
  if(state.categories.includes(name)){alert('Category already exists');newCategoryInput.value='';return;}
  state.categories.push(name);saveState();newCategoryInput.value='';renderCategories();renderWords();
});

addWordBtn.addEventListener('click',()=>{
  const cat=addWordCategory.value;const kor=(addWordKorean.value||'').trim();const eng=(addWordEnglish.value||'').trim();
  if(!kor||!eng){alert('Enter both Korean and English');return;}
  state.words.push({id:genId(),category:cat,korean:kor,english:eng,completed:false,drawing:null});
  saveState();addWordKorean.value='';addWordEnglish.value='';renderWords();flashMessage('Word added');
});

saveBtn.addEventListener('click',()=> {
  saveState();
  alert('Saved! ✅'); // ← mesaj simplu, ușor de văzut
});

clearBtn.addEventListener('click',()=>{
  state.words.forEach(w=>w.completed=false);
  saveState();renderWords();flashMessage('All words unmarked');
});

function renderVocab(){
  const filter=vocabFilter.value||'all';const q=(vocabSearch.value||'').trim().toLowerCase();
  let list=state.words.filter(w=>w.completed);
  if(filter!=='all')list=list.filter(w=>w.category===filter);
  if(q)list=list.filter(w=>(w.korean+' '+w.english).toLowerCase().includes(q));
  vocabList.innerHTML='';
  if(list.length===0){vocabList.innerHTML='<div class="small">No completed words match.</div>';return;}
  list.forEach(w=>{
    const row=document.createElement('div');row.style.padding='8px';row.style.borderBottom='1px solid #eef2f7';
    const left=document.createElement('div');left.innerHTML=`<strong>${w.korean}</strong> <span class="small">— ${w.english}</span>`;
    const right=document.createElement('div');right.style.display='flex';right.style.gap='8px';right.style.alignItems='center';
    right.innerHTML=`<span class="small">${w.category}</span><button data-id="${w.id}" class="openWordFromVocab">Open</button>`;
    const container=document.createElement('div');container.style.display='flex';container.style.justifyContent='space-between';
    container.appendChild(left);container.appendChild(right);row.appendChild(container);vocabList.appendChild(row);
  });
  vocabList.querySelectorAll('.openWordFromVocab').forEach(btn=>{
    btn.addEventListener('click',(e)=>{
      const id=e.target.getAttribute('data-id');
      vocabBackdrop.style.display='none';
      setTimeout(()=>openWordModal(id),150);
    });
  });
}

closeWordModal.addEventListener('click',()=>{closeWord();renderWords();});
closeWordModal2.addEventListener('click',()=>{closeWord();renderWords();});

drawCanvas.addEventListener('pointerdown',startDraw,{passive:false});
drawCanvas.addEventListener('pointermove',moveDraw,{passive:false});
drawCanvas.addEventListener('pointerup',endDraw);
drawCanvas.addEventListener('pointercancel',endDraw);
drawCanvas.addEventListener('pointerout',endDraw);
drawCanvas.addEventListener('pointerleave',endDraw);

clearCanvasBtn.addEventListener('click',()=>clearCanvas());
saveDrawingBtn.addEventListener('click',()=>saveCanvasToState());
markCompleteChk.addEventListener('change',()=>{
  if(!currentWordId)return;
  const w=state.words.find(x=>x.id===currentWordId);
  if(w){w.completed=markCompleteChk.checked;saveState();renderWords();}
});

wordsGrid.addEventListener('dblclick',(e)=>{
  const card=e.target.closest('.card');
  if(!card)return;
  const id=card.getAttribute('data-id');
  const w=state.words.find(x=>x.id===id);
  if(w){w.completed=!w.completed;saveState();renderWords();}
});

document.querySelectorAll('.modal-backdrop').forEach(back=>{
  back.addEventListener('click',(ev)=>{if(ev.target===back)back.style.display='none';});
});
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){
    if(wordModalBackdrop.style.display==='flex'){closeWord();renderWords();}
    if(vocabBackdrop.style.display==='flex'){vocabBackdrop.style.display='none';}
  }
});

window.addEventListener('resize',()=>{
  if(wordModalBackdrop.style.display==='flex'){
    resizeCanvas();
    if(currentWordId){
      const w=state.words.find(x=>x.id===currentWordId);
      if(w && w.drawing){
        const img=new Image();
        img.onload=()=>{ctx.drawImage(img,0,0,drawCanvas.width/(window.devicePixelRatio||1),drawCanvas.height/(window.devicePixelRatio||1));};
        img.src=w.drawing;
      }
    }
  }
});

window.addEventListener('beforeunload',()=>saveState());
})();
</script>
  <div id="toast"></div>

</body>
</html>
